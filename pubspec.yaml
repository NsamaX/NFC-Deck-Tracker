name: nfc_deck_tracker
description: "A Flutter app for managing and tracking card decks using NFC technology."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_storage: ^12.4.6
  google_sign_in: ^6.2.2

  supabase_flutter: ^2.9.1

  shared_preferences: ^2.3.3
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.1

  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  get_it: ^8.0.2

  connectivity_plus: ^6.1.3
  equatable: ^2.0.7
  flutter_dotenv: ^5.2.1
  http: ^1.3.0
  intl: ^0.20.2
  logger: ^2.5.0
  nfc_manager: ^3.5.0
  package_info_plus: ^8.3.0
  permission_handler: ^12.0.0+1
  uuid: ^4.5.1

  dotted_border: ^2.1.0
  fl_chart: ^0.70.2
  flutter_native_splash: ^2.4.4
  flutter_slidable: ^4.0.0
  flutter_svg: ^2.2.0
  image_picker: ^1.1.2
  qr_code_scanner_plus: ^2.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.0+3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/image/icon.png"
  adaptive_icon_foreground: "assets/image/icon_foreground.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/font/
    - assets/icon/
    - assets/image/
    - assets/image/game/
    - assets/locale/

  fonts:
    - family: PlaypenSansThai
      fonts:
        - asset: assets/font/PlaypenSansThai-Thin.ttf
          weight: 100
        - asset: assets/font/PlaypenSansThai-ExtraLight.ttf
          weight: 200
        - asset: assets/font/PlaypenSansThai-Light.ttf
          weight: 300
        - asset: assets/font/PlaypenSansThai-Regular.ttf
          weight: 400
        - asset: assets/font/PlaypenSansThai-Medium.ttf
          weight: 500
        - asset: assets/font/PlaypenSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/font/PlaypenSansThai-Bold.ttf
          weight: 700
        - asset: assets/font/PlaypenSansThai-ExtraBold.ttf
          weight: 800
